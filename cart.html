<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ShopNova | Cart</title>


<link rel="stylesheet" href="../style.css">


<style>


.cart-container{

    padding:50px 8%;

}


.cart-item{

    background:white;

    display:flex;

    justify-content:space-between;

    align-items:center;

    padding:20px;

    margin-bottom:20px;

    border-radius:15px;

    box-shadow:0 10px 25px rgba(0,0,0,0.08);

}


.cart-item img{

    width:120px;

    height:100px;

    object-fit:cover;

    border-radius:10px;

}


.cart-info{

    flex:1;

    margin-left:20px;

}


.remove-btn{

    background:#ef4444;

    color:white;

    border:none;

    padding:10px 20px;

    border-radius:20px;

    cursor:pointer;

}


.total-box{

    background:#111827;

    color:white;

    padding:30px;

    border-radius:20px;

    text-align:center;

    font-size:25px;

}


.checkout-btn{

    display:inline-block;

    margin-top:20px;

    background:#38bdf8;

    color:#111827;

    padding:15px 40px;

    border-radius:30px;

    text-decoration:none;

    font-weight:bold;

}


@media(max-width:700px){

.cart-item{

    flex-direction:column;

    gap:15px;

}

}



</style>


</head>


<body>



<!-- NAVBAR -->


<nav class="navbar">


<div class="logo">

Shop<span>Nova</span>

</div>



<ul class="nav-links">


<li>
<a href="../index.html">
Home
</a>
</li>


<li>
<a href="products.html">
Products
</a>
</li>


<li>
<a href="cart.html">
Cart
</a>
</li>


</ul>


</nav>





<h1 class="section-title">

Your Shopping Cart 🛒

</h1>





<div class="cart-container">


<div id="cartItems">


</div>



<div class="total-box">


Total:

₹<span id="totalPrice">
0
</span>


<br>


<a href="checkout.html" 
class="checkout-btn">

Proceed To Checkout

</a>


</div>



</div>







<footer>

<h3>
ShopNova
</h3>

<p>
Premium Online Shopping Experience
</p>

</footer>







<script>



let cart =
JSON.parse(localStorage.getItem("cart"))
|| [];



const cartItems =
document.getElementById("cartItems");


const totalPrice =
document.getElementById("totalPrice");




function displayCart(){


cartItems.innerHTML="";


let total = 0;



if(cart.length===0){


cartItems.innerHTML=`

<h2 style="text-align:center">

Your cart is empty 🛒

</h2>

`;


}



cart.forEach((item,index)=>{


total += item.price;



cartItems.innerHTML += `


<div class="cart-item">


<img src="${item.image}">



<div class="cart-info">


<h2>

${item.name}

</h2>


<h3>

₹${item.price}

</h3>


</div>



<button

class="remove-btn"

onclick="removeItem(${index})">

Remove

</button>


</div>


`;


});



totalPrice.innerHTML = total;



}





function removeItem(index){


cart.splice(index,1);



localStorage.setItem(

"cart",

JSON.stringify(cart)

);



displayCart();


}



displayCart();



</script>




</body>

</html>
