<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ShopNova Cart</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<header>

    <div class="logo">
        ShopNova
    </div>


    <nav>

        <a href="index.html">Home</a>

        <a href="products.html">Products</a>

        <a href="cart.html">Cart 🛒</a>

    </nav>


</header>




<section class="cart-page">



    <!-- LEFT CART SECTION -->

    <div class="empty-cart">


        <div class="cart-icon">
            🛒
        </div>


        <h1>
            Your Cart is Empty
        </h1>


        <p>
            Looks like you haven't added anything yet.
        </p>


        <a href="products.html" class="shop-btn">
            Continue Shopping
        </a>


    </div>





    <!-- RIGHT PRICE SECTION -->


    <div class="price-card">


        <h2>
            Price Details
        </h2>



        <div>

            <span>
                Subtotal
            </span>


            <span>
                ₹0
            </span>


        </div>





        <div>

            <span>
                Delivery
            </span>


            <span>
                Free
            </span>


        </div>





        <div>

            <span>
                Discount
            </span>


            <span>
                ₹0
            </span>


        </div>





        <hr>





        <h3>


            <span>
                Total Amount
            </span>


            <span>
                ₹0
            </span>


        </h3>





        <button>
            Proceed To Checkout
        </button>



    </div>



</section>





<footer>

    © 2026 ShopNova. All Rights Reserved.

</footer>



</body>

</html>
