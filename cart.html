```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopNova Cart</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #eaf4ff;
      padding: 20px;
    }

    .cart-box {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      color: #2563eb;
    }

    .item {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid #ddd;
    }

    .total {
      margin-top: 20px;
      font-size: 1.2rem;
      font-weight: bold;
      text-align: right;
    }

    .checkout-btn {
      display: block;
      width: 100%;
      margin-top: 20px;
      padding: 12px;
      background: #2563eb;
      color: white;
      text-align: center;
      text-decoration: none;
      border-radius: 10px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="cart-box">
    <h1>🛒 Your Cart</h1>

    <div id="cartItems"></div>

    <div class="total" id="cartTotal">Total: ₹0</div>

    <a href="checkout.html" class="checkout-btn">Proceed to Checkout 💳</a>
  </div>

  <script>
    let cart = JSON.parse(localStorage.getItem('shopnovaCart')) || [];

    let itemsDiv = document.getElementById('cartItems');
    let total = 0;

    cart.forEach(item => {
      total += item.price;

      itemsDiv.innerHTML += `
        <div class="item">
          <span>${item.name}</span>
          <span>₹${item.price}</span>
        </div>
      `;
    });

    document.getElementById('cartTotal').innerText = `Total: ₹${total}`;
  </script>

</body>
</html>
```
