<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ShopNova Cart</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<!-- Header -->

<header>

    <div class="logo">
        ShopNova
    </div>


    <nav>

        <a href="index.html">Home</a>

        <a href="laptop.html">Products</a>

        <a href="cart.html">Cart 🛒</a>

    </nav>

</header>




<!-- Cart Section -->


<section class="cart-container">


    <h1>
        Your Shopping Cart 🛒
    </h1>



    <div class="cart-item">


        <img src="https://images.unsplash.com/photo-1496181133206-80ce9b88a853"
        alt="Laptop">



        <div class="cart-details">


            <h2>
                ShopNova Premium Laptop
            </h2>


            <p>
                Intel Core i7 | 16GB RAM | 1TB SSD
            </p>


            <h3>
                ₹89,999
            </h3>



            <label>
                Quantity:
            </label>


            <input type="number" value="1" min="1">



            <button class="remove-btn">
                Remove
            </button>


        </div>


    </div>




    <!-- Price Summary -->


    <div class="cart-summary">


        <h2>
            Price Details
        </h2>


        <p>
            Product Price:
            ₹89,999
        </p>


        <p>
            Delivery:
            Free
        </p>



        <hr>



        <h2>
            Total:
            ₹89,999
        </h2>



        <button class="checkout-btn">

            Proceed To Checkout

        </button>


    </div>



</section>




<footer>

    <p>
        © 2026 ShopNova. All Rights Reserved.
    </p>

</footer>



</body>

</html>
