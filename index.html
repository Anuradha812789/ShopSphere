<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Category Navigation</title>
  <style>
    /* Reset styles for consistency */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    /* Container for the entire list */
    .menu-list {
      display: flex;
      flex-direction: column; /* Stacks rows vertically */
      gap: 20px;              /* Spacing between different categories */
      padding: 20px;
    }

    /* Target individual rows */
    .category-item {
      display: flex;          /* Activates flexbox */
      flex-direction: row;    /* Forces icon and text side-by-side */
      align-items: center;    /* Vertically aligns icon and text centers */
      gap: 12px;              /* Space between the icon and the text */
    }

    /* Style the text labels */
    .category-text {
      font-size: 16px;
      font-weight: bold;
      color: #000000;
    }

    /* Optional styling for your icon images */
    .category-item img {
      width: 24px;
      height: 24px;
      object-fit: contain;
    }
  </style>
</head>
<body>

  <div class="menu-list">

    <!-- Electronics -->
    <div class="category-item">
      <img src="https://placehold.co💻" alt="Electronics">
      <span class="category-text">Electronics</span>
    </div>

    <!-- Fashion -->
    <div class="category-item">
      <img src="https://placehold.co👕" alt="Fashion">
      <span class="category-text">Fashion</span>
    </div>

    <!-- Mobiles -->
    <div class="category-item">
      <img src="https://placehold.co📱" alt="Mobiles">
      <span class="category-text">Mobiles</span>
    </div>

    <!-- Gaming -->
    <div class="category-item">
      <img src="https://placehold.co🎮" alt="Gaming">
      <span class="category-text">Gaming</span>
    </div>

  </div>

</body>
</html>
