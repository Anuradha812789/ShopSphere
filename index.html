<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopNova - Our Products</title>
  <style>
    /* Compacted CSS for the Product Grid Layout */
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body { background-color: #f8f9fa; color: #1f2937; }
    header { background-color: #0b1a30; color: #ffffff; display: flex; justify-content: space-between; align-items: center; padding: 15px 5%; position: sticky; top: 0; z-index: 100; }
    .logo { font-size: 24px; font-weight: bold; color: #3b82f6; }
    nav a { color: #ffffff; text-decoration: none; margin-left: 20px; font-size: 14px; }
    .main-container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
    .section-title { text-align: center; font-size: 32px; margin-bottom: 40px; }
    .product-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 30px; }
    .product-card { background: #ffffff; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05); display: flex; flex-direction: column; }
    .product-image-container { width: 100%; height: 240px; overflow: hidden; }
    .product-image-container img { width: 100%; height: 100%; object-fit: cover; }
    .product-info { padding: 20px; flex-grow: 1; }
    .product-title { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
    .price-tag { font-size: 22px; font-weight: 800; color: #059669; }
    .button-group { display: flex; gap: 12px; padding: 0 20px 20px 20px; }
    .action-btn { flex: 1; padding: 12px; border-radius: 8px; border: none; cursor: pointer; font-weight: 700; }
    .cart-btn { background-color: #f3f4f6; }
    .buy-btn { background-color: #ff9900; color: #ffffff; }
    .contact-section { background: #f3f4f6; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
    .social-row { display: flex; gap: 10px; }
    .social-btn { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; text-decoration: none; color: white; }
    .wa { background-color: #25d366; } .ig { background-color: #e1306c; } .fb { background-color: #1877f2; }
  </style>
</head>
<body>
  <header><div class="logo">ShopNova</div><nav><a href="index.html">Home</a><a href="cart.html">Cart 🛒</a></nav></header>
  <main class="main-container">
    <h1 class="section-title">Our Products</h1>
    <div class="product-grid">
      <!-- Product Card -->
      <div class="product-card">
        <div class="product-image-container"><img src="https://unsplash.com" alt="Product"></div>
        <div class="product-info"><h2 class="product-title">Premium Desk Pack</h2><div class="price-tag">₹12,499.00</div></div>
        <div class="button-group"><button class="action-btn cart-btn">Add To Cart</button><button class="action-btn buy-btn">Buy Now</button></div>
        <div class="contact-section"><span>Connect:</span><div class="social-row"><a href="#" class="social-btn wa">W</a><a href="#" class="social-btn ig">I</a><a href="#" class="social-btn fb">F</a></div></div>
      </div>
    </div>
  </main>
</body>
</html>
