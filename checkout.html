
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopNova Payment</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="logo">ShopNova</div>
</header>

<section class="product-page">

    <div class="product-info" style="width:100%;">

        <h1>Complete Your Payment</h1>

        <h2>₹89,999</h2>

        <p>Choose your preferred UPI payment app:</p>

        <div class="buttons" style="flex-wrap:wrap;">

            <a href="upi://pay?pa=yourupi@oksbi&pn=ShopNova&am=89999"
               class="buy-btn"
               style="text-decoration:none;display:inline-block;text-align:center;">
               Google Pay
            </a>

            <a href="upi://pay?pa=yourupi@oksbi&pn=ShopNova&am=89999"
               class="buy-btn"
               style="text-decoration:none;display:inline-block;text-align:center;">
               PhonePe
            </a>

            <a href="upi://pay?pa=yourupi@oksbi&pn=ShopNova&am=89999"
               class="buy-btn"
               style="text-decoration:none;display:inline-block;text-align:center;">
               Paytm
            </a>

        </div>

        <p style="margin-top:25px;font-size:14px;color:#555;">
            Replace <strong>yourupi@oksbi</strong> with your real UPI ID.
        </p>

    </div>

</section>

</body>
</html>
