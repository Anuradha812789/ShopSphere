
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - ShopNova Pro</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #dbeafe, #eff6ff, #e0f2fe);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .checkout-box {
      width: 100%;
      max-width: 500px;
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      color: #2563eb;
      margin-bottom: 25px;
    }

    input, textarea, select {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }

    input:focus, textarea:focus, select:focus {
      border-color: #2563eb;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      text-decoration: none;
      display: block;
      text-align: center;
      transition: 0.3s;
    }

    .place-btn {
      background: #2563eb;
      color: white;
    }

    .place-btn:hover {
      background: #1d4ed8;
    }

    .home-btn {
      background: #0ea5e9;
      color: white;
    }

    .home-btn:hover {
      background: #0284c7;
    }
  </style>
</head>
<body>

  <div class="checkout-box">
    <h1>💳 Secure Checkout</h1>

    <input type="text" id="name" placeholder="👤 Full Name">

    <input type="text" id="mobile" placeholder="📱 Mobile Number">

    <textarea id="address" placeholder="🏠 Delivery Address"></textarea>

    <select id="payment">
      <option>💵 Cash on Delivery</option>
      <option>📲 UPI Payment</option>
      <option>💳 Credit / Debit Card</option>
    </select>

    <button class="btn place-btn" onclick="placeOrder()">
      🚀 Place Order
    </button>

    <a href="https://anuradha812789.github.io/ShopSphere/" class="btn home-btn">
      🏠 Return to Home
    </a>
  </div>

  <script>
    function placeOrder() {
      const name = document.getElementById("name").value.trim();
      const mobile = document.getElementById("mobile").value.trim();
      const address = document.getElementById("address").value.trim();

      if (!name || !mobile || !address) {
        alert("⚠️ Please fill all details before placing the order.");
        return;
      }

      // Clear cart
      localStorage.removeItem("shopnovaCart");

      alert("🎉 Order placed successfully! Thank you for shopping with ShopNova 💙");

      // Go back to homepage
      window.location.href = "https://anuradha812789.github.io/ShopSphere/";
    }
  </script>

</body>
</html>
