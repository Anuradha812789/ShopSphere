
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - ShopNova Pro</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #dbeafe;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .checkout-box {
      background: white;
      padding: 30px;
      border-radius: 18px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      color: #2563eb;
      margin-bottom: 25px;
    }

    input, textarea, select {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 15px;
    }

    button, .home-btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      display: block;
      text-align: center;
      margin-top: 10px;
    }

    button {
      background: #2563eb;
      color: white;
    }

    .home-btn {
      background: #0ea5e9;
      color: white;
    }

    button:hover {
      background: #1d4ed8;
    }

    .home-btn:hover {
      background: #0284c7;
    }
  </style>
</head>
<body>

  <div class="checkout-box">
    <h1>💳 Secure Checkout</h1>

    <input type="text" id="name" placeholder="Full Name">
    <input type="text" id="mobile" placeholder="Mobile Number">
    <textarea id="address" placeholder="Delivery Address"></textarea>

    <select id="payment">
      <option>Cash on Delivery</option>
      <option>UPI Payment</option>
      <option>Credit / Debit Card</option>
    </select>

    <button onclick="placeOrder()">🚀 Place Order</button>

    <!-- FIXED HOME BUTTON -->
    <a href="./index.html" class="home-btn">🏠 Return to Home</a>
  </div>

  <script>
    function placeOrder() {
      const name = document.getElementById('name').value.trim();
      const mobile = document.getElementById('mobile').value.trim();
      const address = document.getElementById('address').value.trim();

      if (!name || !mobile || !address) {
        alert('⚠️ Please fill all details');
        return;
      }

      localStorage.removeItem('shopnovaCart');

      alert('🎉 Order placed successfully! Thank you for shopping with ShopNova 💙');

      // Go back to homepage correctly
      window.location.href = './index.html';
    }
  </script>

</body>
</html>
