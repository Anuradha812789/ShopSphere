
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - ShopNova</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #dbeafe;
      padding: 20px;
    }

    .checkout-box {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      color: #2563eb;
    }

    input, textarea, select {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="checkout-box">
    <h1>💳 Checkout</h1>

    <input type="text" placeholder="Full Name">
    <input type="text" placeholder="Mobile Number">
    <textarea placeholder="Delivery Address"></textarea>

    <select>
      <option>Cash on Delivery</option>
      <option>UPI Payment</option>
      <option>Credit / Debit Card</option>
    </select>

    <button onclick="placeOrder()">Place Order 🚀</button>
  </div>

  <script>
    function placeOrder() {
      localStorage.removeItem('shopnovaCart');
      alert('🎉 Order placed successfully! Thank you for shopping with ShopNova 💙');
      window.location.href = 'index.html';
    }
  </script>

</body>
</html>
