<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>ShopNova | Checkout</title>


<link rel="stylesheet" href="../style.css">


<style>


.checkout-container{


    padding:50px 8%;

    display:grid;

    grid-template-columns:
    1fr 1fr;

    gap:40px;


}



.checkout-box{


    background:white;

    padding:30px;

    border-radius:20px;

    box-shadow:
    0 10px 30px rgba(0,0,0,.1);


}



.checkout-box h2{


    margin-bottom:20px;

}




.checkout-box input,


.checkout-box textarea,


.checkout-box select{


    width:100%;

    padding:15px;

    margin:10px 0;

    border-radius:10px;

    border:1px solid #ddd;

    outline:none;


}



.order-item{


    display:flex;

    justify-content:space-between;

    padding:15px 0;

    border-bottom:1px solid #ddd;


}



.place-btn{


    width:100%;

    padding:15px;

    margin-top:20px;

    border:none;

    background:#2563eb;

    color:white;

    font-size:18px;

    border-radius:30px;

    cursor:pointer;


}



.place-btn:hover{


    background:#111827;


}



.success{


    display:none;

    text-align:center;

    padding:40px;

    font-size:25px;

    color:#16a34a;


}



@media(max-width:800px){


.checkout-container{

    grid-template-columns:1fr;

}


}



</style>


</head>


<body>



<!-- NAVBAR -->

<nav class="navbar">


<div class="logo">

Shop<span>Nova</span>

</div>


<ul class="nav-links">


<li>
<a href="../index.html">
Home
</a>
</li>


<li>
<a href="products.html">
Products
</a>
</li>


<li>
<a href="cart.html">
Cart
</a>
</li>


</ul>


</nav>





<h1 class="section-title">

Checkout 🚀

</h1>






<div class="checkout-container">



<!-- ADDRESS -->


<div class="checkout-box">


<h2>
Delivery Address
</h2>



<input 
type="text"
placeholder="Full Name">



<input 
type="text"
placeholder="Mobile Number">



<textarea

placeholder="Complete Address">

</textarea>



<input

type="text"

placeholder="City">



<input

type="text"

placeholder="PIN Code">


</div>







<!-- ORDER SUMMARY -->


<div class="checkout-box">


<h2>
Order Summary
</h2>



<div id="orderItems">


</div>



<h2>

Total: ₹<span id="total">

0

</span>

</h2>



<select>


<option>
Cash On Delivery
</option>


<option>
UPI Payment
</option>


<option>
Credit / Debit Card
</option>


</select>





<button

class="place-btn"

onclick="placeOrder()">

Place Order

</button>




<div class="success" id="success">


🎉

Order Placed Successfully!


<br>

Thank you for shopping with ShopNova


</div>



</div>



</div>







<script>



let cart =

JSON.parse(

localStorage.getItem("cart")

)||[];




let orderItems =

document.getElementById(
"orderItems"
);



let total = 0;



cart.forEach(item=>{


total += item.price;



orderItems.innerHTML += `


<div class="order-item">


<span>

${item.name}

</span>


<span>

₹${item.price}

</span>


</div>


`;



});



document.getElementById(
"total"
).innerHTML = total;






function placeOrder(){



localStorage.removeItem(
"cart"
);



document.getElementById(
"success"
)
.style.display="block";



}



</script>



</body>


</html>
