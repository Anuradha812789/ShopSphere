<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>ShopNova | Login</title>


<link rel="stylesheet" href="../style.css">



<style>


body{

    min-height:100vh;

    background:
    linear-gradient(
    135deg,
    #111827,
    #2563eb
    );

}



.auth-container{


    width:400px;

    background:white;

    padding:40px;

    border-radius:25px;

    position:absolute;

    top:50%;

    left:50%;

    transform:translate(-50%,-50%);


    box-shadow:
    0 20px 50px rgba(0,0,0,.2);


}



.auth-container h1{

    text-align:center;

    margin-bottom:30px;

}



.auth-container input{


    width:100%;

    padding:15px;

    margin:12px 0;

    border-radius:10px;

    border:1px solid #ddd;

    outline:none;

    font-size:16px;


}




.auth-btn{


    width:100%;

    padding:15px;

    background:#2563eb;

    color:white;

    border:none;

    border-radius:30px;

    font-size:17px;

    cursor:pointer;


}



.auth-btn:hover{

    background:#111827;

}



.switch{


    text-align:center;

    margin-top:20px;

    color:#2563eb;

    cursor:pointer;

}




#registerBox{

    display:none;

}




</style>


</head>



<body>




<div class="auth-container">



<!-- LOGIN -->


<div id="loginBox">


<h1>

Welcome Back 👋

</h1>



<input

id="loginEmail"

type="email"

placeholder="Email Address">


<input

id="loginPassword"

type="password"

placeholder="Password">



<button

class="auth-btn"

onclick="login()">

Login

</button>



<p class="switch"

onclick="showRegister()">

New user? Create Account

</p>



</div>






<!-- REGISTER -->


<div id="registerBox">


<h1>

Create Account 🚀

</h1>



<input

id="name"

type="text"

placeholder="Full Name">



<input

id="email"

type="email"

placeholder="Email Address">


<input

id="password"

type="password"

placeholder="Password">



<button

class="auth-btn"

onclick="register()">

Register

</button>



<p class="switch"

onclick="showLogin()">

Already have account? Login

</p>


</div>



</div>






<script>



function showRegister(){


document.getElementById("loginBox")
.style.display="none";


document.getElementById("registerBox")
.style.display="block";


}





function showLogin(){


document.getElementById("registerBox")
.style.display="none";


document.getElementById("loginBox")
.style.display="block";


}





function register(){


let user={


name:
document.getElementById("name").value,


email:
document.getElementById("email").value,


password:
document.getElementById("password").value


};



if(
user.email==="" ||
user.password===""
){


alert("Please fill all details");


return;


}



localStorage.setItem(

"user",

JSON.stringify(user)

);



alert(

"Registration Successful 🎉"

);



showLogin();


}







function login(){


let user =

JSON.parse(

localStorage.getItem("user")

);



let email =

document.getElementById("loginEmail")
.value;



let password =

document.getElementById("loginPassword")
.value;




if(

user &&

email===user.email &&

password===user.password

){


localStorage.setItem(

"loggedIn",

"true"

);



alert(

"Login Successful 🚀"

);



window.location.href="../index.html";



}

else{


alert(

"Invalid Email or Password"

);


}



}




</script>




</body>

</html>
